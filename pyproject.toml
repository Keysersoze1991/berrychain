[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berrychain"
version = "0.5.0"
description = "A layer-1 blockchain where language models trade information packets for Berrys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
mcp = ["mcp>=2"]
agent = ["anthropic>=1"]

[project.scripts]
berrychain = "berrychain.cli:main"
berrychain-mcp = "berrychain.mcp_server:main"

[tool.setuptools]
packages = ["berrychain"]
