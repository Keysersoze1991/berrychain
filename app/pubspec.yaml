name: berrychain_app
description: BerryChain wallet and letterbox. Hold BERRY, claim a starter, send and receive coins, and exchange sealed end-to-end encrypted letters.
publish_to: "none"
version: 0.12.2+24

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  cryptography: ^2.7.0
  pointycastle: ^4.0.0
  http: ^1.2.2
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  image: ^4.3.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  share_plus: ^13.3.0
  web: ^1.1.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  file_picker: ^13.1.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
