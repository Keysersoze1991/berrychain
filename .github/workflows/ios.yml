name: iOS

# Two jobs on GitHub's macOS runners (free for public repositories):
#   compile   - on every push that touches the app: an unsigned build, proving
#               the code compiles for iPhone. Needs nothing from Apple.
#   testflight - on manual dispatch or a tag like ios-v0.5.1: signs with the
#               distribution certificate and profile held in repository secrets
#               and uploads to TestFlight through an App Store Connect API key.
#               See docs/IOS_RELEASE.md for the secrets.

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios.yml"]
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Run the tests, and put any failure in the run summary
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            { echo "## Test failure"; echo; echo '```'; grep -n -A 40 '\[E\]' test.log | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -A 30 '\[E\]' test.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -60 test.log
          else
            echo "## Tests passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  compile:
    name: Compile (unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Build for iPhone without signing
        run: |
          set +e
          flutter build ios --release --no-codesign > build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            grep -n -i -E "error:|error |failed|Undefined|not found|ambiguous" build.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -80 build.log
          fi
          exit $status
      - name: Report
        run: du -sh build/ios/iphoneos/Runner.app && echo "compiles for iPhone"

  testflight:
    name: Sign and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    needs: compile
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the secrets are present
        run: |
          for v in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_PROFILE_BASE64 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "missing secret $v (see docs/IOS_RELEASE.md)"; exit 1; fi
          done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install the certificate and profile
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYPASS=$(uuidgen)
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12 || fail "APPLE_CERT_P12_BASE64 is not valid base64"
          echo "$APPLE_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/app.mobileprovision || fail "APPLE_PROFILE_BASE64 is not valid base64"
          echo "p12 bytes: $(wc -c < $RUNNER_TEMP/dist.p12) sha256 $(shasum -a 256 $RUNNER_TEMP/dist.p12 | cut -c1-16)"
          echo "profile bytes: $(wc -c < $RUNNER_TEMP/app.mobileprovision) sha256 $(shasum -a 256 $RUNNER_TEMP/app.mobileprovision | cut -c1-16)"
          echo "::notice::decoded p12 sha256 $(shasum -a 256 $RUNNER_TEMP/dist.p12 | cut -c1-16), profile sha256 $(shasum -a 256 $RUNNER_TEMP/app.mobileprovision | cut -c1-16), profile bytes $(wc -c < $RUNNER_TEMP/app.mobileprovision)"
          [ "$(wc -c < $RUNNER_TEMP/dist.p12)" -gt 1000 ] || fail "the decoded p12 is too small: APPLE_CERT_P12_BASE64 was probably pasted incompletely"
          [ "$(wc -c < $RUNNER_TEMP/app.mobileprovision)" -gt 5000 ] || fail "the decoded profile is too small: APPLE_PROFILE_BASE64 was probably pasted incompletely"
          openssl pkcs12 -in $RUNNER_TEMP/dist.p12 -passin "pass:$APPLE_CERT_PASSWORD" -noout -legacy 2>/dev/null             || openssl pkcs12 -in $RUNNER_TEMP/dist.p12 -passin "pass:$APPLE_CERT_PASSWORD" -noout 2>/dev/null             || fail "the p12 does not open with APPLE_CERT_PASSWORD (wrong password, or the p12 was pasted incompletely)"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN" || fail "create-keychain failed"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN" || fail "unlock-keychain failed"
          security import $RUNNER_TEMP/dist.p12 -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" || fail "security import of the p12 failed"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYPASS" "$KEYCHAIN" > /dev/null || fail "set-key-partition-list failed"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN" | head -3
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i $RUNNER_TEMP/app.mobileprovision > $RUNNER_TEMP/profile.plist 2>/dev/null             || openssl smime -inform DER -verify -noverify -in $RUNNER_TEMP/app.mobileprovision -out $RUNNER_TEMP/profile.plist 2>/dev/null             || fail "the profile could not be decoded: APPLE_PROFILE_BASE64 does not contain the .mobileprovision file (bytes $(wc -c < $RUNNER_TEMP/app.mobileprovision), sha256 $(shasum -a 256 $RUNNER_TEMP/app.mobileprovision | cut -c1-16))"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' $RUNNER_TEMP/profile.plist) || fail "no UUID in the profile"
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' $RUNNER_TEMP/profile.plist) || fail "no Name in the profile"
          cp $RUNNER_TEMP/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV
          echo "installed profile '$NAME'"
      - name: Write export options
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>link.berrychain.wallet</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
      - name: Build the signed archive
        run: |
          flutter build ipa --release \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist \
            --build-number=${{ github.run_number }}
          ls -la build/ios/ipa/
      - name: Upload to TestFlight
        run: |
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p ~/.private_keys
          KEY=~/.private_keys/AuthKey_$ASC_KEY_ID.p8
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s
' "$ASC_KEY_P8_BASE64" | tr -d '' > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' 
	' | base64 --decode > "$KEY"               || fail "ASC_KEY_P8_BASE64 is neither the .p8 file's text nor valid base64: re-paste it from paste_ASC_KEY_P8_BASE64.txt"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$KEY" || fail "the decoded ASC_KEY_P8_BASE64 does not look like a .p8 key: re-paste it from paste_ASC_KEY_P8_BASE64.txt"
          echo "::notice::App Store Connect key sha256 $(shasum -a 256 "$KEY" | cut -c1-16)"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Keep the ipa as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: berrychain-ios-${{ github.run_number }}
          path: app/build/ios/ipa/*.ipa
          retention-days: 14
