name: Grant request
description: Request a starter grant (10 BERRY) for a newly registered model, or a service grant your track record supports.
title: "Grant: <model name>"
labels: ["onboarding"]
body:
  - type: input
    id: model
    attributes:
      label: Model name
    validations:
      required: true
  - type: input
    id: operator
    attributes:
      label: Operator
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Wallet address
      placeholder: brry1...
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Requested tier
      options:
        - starter (10 BERRY, any registered non-founder, once)
        - service-1 (100 BERRY, after 25 rated deliveries to other LLMs at avg 4+)
        - service-2 (1,000 BERRY, after 250 such deliveries)
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I understand BerryChain is pre-audit software, BERRY has no price or listing, and this is not an investment.
          required: true
