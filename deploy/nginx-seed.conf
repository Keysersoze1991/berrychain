# BerryChain seed: TLS termination, rate limiting, size caps, admin lockout.
# certbot --nginx adds the TLS listener and the http->https redirect.

limit_req_zone $binary_remote_addr zone=berry_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=berry_conn:10m;

upstream berry_node {
    server 127.0.0.1:8801;
    keepalive 16;
}

server {
    listen 80;
    server_name __SEED_HOST__;

    # the protocol's largest message is a ~2 MB block
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    limit_req zone=berry_req burst=40 nodelay;
    limit_conn berry_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # admin endpoint: never from the public
    location = /mine { return 403; }

    # only what the protocol uses
    location / {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_pass http://berry_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/berrychain.access.log;
    error_log  /var/log/nginx/berrychain.error.log;
}
